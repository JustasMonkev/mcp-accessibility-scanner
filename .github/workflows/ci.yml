name: CI

# `branches` filters the pull request's BASE branch, and it takes globs, not
# prefixes: the previous value ['feat/'] matched only a base branch named
# literally "feat/", so no pull request into main ever triggered this workflow
# and the suite was effectively never run.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `chrome` as well as `chromium`: the server's default launch channel is
      # branded Chrome (src/config.ts), so the end-to-end harness below cannot
      # start a browser with only the bundled chromium installed.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium chrome

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Run lint
        run: npm run lint

      # Coverage runs the same suite and additionally enforces the thresholds
      # in vitest.config.ts, which nothing ran before.
      # MCP_REQUIRE_BROWSER turns a missing browser into a failure instead of
      # ~55 browser-backed tests silently skipping while the run reports green.
      - name: Run tests with coverage thresholds
        run: npm run test:coverage
        env:
          MCP_REQUIRE_BROWSER: '1'

      - name: Build
        run: npm run build

      # The only end-to-end coverage of the MCP tool surface; it drives the
      # built cli.js over stdio and was never run by CI.
      - name: Run MCP end-to-end harness
        run: npm run test:mcp
