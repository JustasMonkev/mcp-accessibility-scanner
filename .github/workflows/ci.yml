name: CI

# `branches` filters the pull request's BASE branch, and it takes globs, not
# prefixes: the previous value ['feat/'] matched only a base branch named
# literally "feat/", so no pull request into main ever triggered this workflow
# and the suite was effectively never run.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Run lint
        run: npm run lint

      # Coverage runs the same suite and additionally enforces the thresholds
      # in vitest.config.ts, which nothing ran before.
      - name: Run tests with coverage thresholds
        run: npm run test:coverage

      - name: Build
        run: npm run build
